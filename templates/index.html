<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kazamidori - サイクリング風向・風速マップ</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 6px 12px 8px 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin: 0 0 5px 0;
        }

        header h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
        }

        header span {
            font-size: 12px;
            color: #64748b;
        }

        /* upload-box と #status を横並びにするコンテナ */
        .top-control-row {
            position: relative;
            z-index: 20;
            display: flex;
            align-items: stretch;
            gap: 10px;
            margin-bottom: 6px;
        }

        .upload-box {
            position: relative;
            z-index: 21;
            flex: 1 1 auto;
            margin: 0;
            padding: 5px 14px;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #ffffff;
            border: 2px dashed #94a3b8;
            border-radius: 7px;
            cursor: pointer;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        .upload-box:hover,
        .upload-box.dragover {
            border-color: #2563eb;
            background-color: #eff6ff;
        }

        #select-btn {
            position: relative;
            z-index: 22;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            background-color: #1e293b;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            white-space: nowrap;
        }

        #select-btn:hover {
            background-color: #334155;
        }

        .upload-hint {
            font-size: 12px;
            color: #475569;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ステータス表示枠（横並び） */
        #status {
            flex: 0 1 360px;
            margin: 0;
            padding: 5px 12px;
            min-height: 38px;
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #status:empty {
            display: none;
        }

        #status.loading {
            background-color: #eff6ff;
            border-color: #93c5fd;
            color: #1d4ed8;
        }

        #status.success {
            background-color: #f0fdf4;
            border-color: #86efac;
            color: #15803d;
        }

        #status.error {
            background-color: #fef2f2;
            border-color: #fca5a5;
            color: #b91c1c;
        }

        /* マップ表示エリア（上部を詰めた分だけ高さを確保） */
        #map-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: calc(100vh - 82px);
            min-height: 520px;
            background-color: #e2e8f0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
        }

        #map-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #placeholder-msg {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 640px) {
            .top-control-row {
                flex-direction: column;
                gap: 6px;
            }
            #status {
                flex: 1 1 auto;
            }
            #map-container {
                height: calc(100vh - 125px);
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🐓 Kazamidori</h1>
        <span>FIT / TCX 風向・風速オーバーレイ解析</span>
    </header>

    <div class="top-control-row">
        <div class="upload-box" id="drop-area">
            <button type="button" id="select-btn">📂 ファイルを選択</button>
            <span class="upload-hint" id="file-label">または FIT / TCX ファイルをここにドロップ</span>
            <input type="file" id="file-input" name="file" accept=".fit,.tcx" style="display: none;">
        </div>
        <div id="status"></div>
    </div>

    <div id="map-container">
        <div id="placeholder-msg">上部の「📂 ファイルを選択」から FIT または TCX ファイルを読み込むと、ここに風向マップが表示されます。</div>
        <iframe id="map-frame" style="display: none;"></iframe>
    </div>

    <script>
        const dropArea = document.getElementById('drop-area');
        const fileInput = document.getElementById('file-input');
        const selectBtn = document.getElementById('select-btn');
        const fileLabel = document.getElementById('file-label');
        const statusDiv = document.getElementById('status');
        const placeholderMsg = document.getElementById('placeholder-msg');
        const mapFrame = document.getElementById('map-frame');

        function setStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = type || '';
        }

        // ボタンクリックでファイル選択ダイアログを開く
        selectBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        // 枠全体クリックでもダイアログを開く
        dropArea.addEventListener('click', () => {
            fileInput.click();
        });

        // ドラッグ＆ドロップ制御
        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropArea.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropArea.classList.remove('dragover');
            });
        });

        dropArea.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                handleFileUpload(files[0]);
            }
        });

        // ファイル選択時の処理
        fileInput.addEventListener('change', () => {
            if (fileInput.files && fileInput.files.length > 0) {
                handleFileUpload(fileInput.files[0]);
            }
        });

        async function handleFileUpload(file) {
            fileLabel.textContent = file.name;
            setStatus(`解析中: ${file.name} ...`, 'loading');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const contentType = response.headers.get('content-type') || '';

                if (!response.ok) {
                    let errMsg = `サーバーエラー (${response.status})`;
                    if (contentType.includes('application/json')) {
                        const errData = await response.json();
                        if (errData.error) errMsg = errData.error;
                    }
                    throw new Error(errMsg);
                }

                if (contentType.includes('application/json')) {
                    const data = await response.json();
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    placeholderMsg.style.display = 'none';
                    mapFrame.style.display = 'block';

                    if (data.map_url) {
                        mapFrame.removeAttribute('srcdoc');
                        mapFrame.src = data.map_url + '?t=' + Date.now();
                    } else if (data.url) {
                        mapFrame.removeAttribute('srcdoc');
                        mapFrame.src = data.url + '?t=' + Date.now();
                    } else if (data.html) {
                        mapFrame.removeAttribute('src');
                        mapFrame.srcdoc = data.html;
                    } else if (data.map_html) {
                        mapFrame.removeAttribute('src');
                        mapFrame.srcdoc = data.map_html;
                    } else {
                        throw new Error('地図データのレスポンス形式が不明です');
                    }
                } else {
                    const htmlText = await response.text();
                    placeholderMsg.style.display = 'none';
                    mapFrame.style.display = 'block';
                    mapFrame.removeAttribute('src');
                    mapFrame.srcdoc = htmlText;
                }

                setStatus(`完了: ${file.name}`, 'success');
            } catch (err) {
                console.error(err);
                setStatus(`エラー: ${err.message}`, 'error');
            } finally {
                fileInput.value = '';
            }
        }
    </script>
</body>
</html>
